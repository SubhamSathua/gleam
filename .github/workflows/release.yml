name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., 1.0.0 - no beta)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK Variants & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading 'v' if present
          CLEAN_VER="${RAW_VER#v}"
          echo "VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "Building Gleam version ${CLEAN_VER}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APKs (All Variants)
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          VER="${{ steps.get_version.outputs.VERSION }}"
          DEST_DIR="build/releases/${VER}"
          mkdir -p "${DEST_DIR}"

          SRC_DIR="app/build/outputs/apk/release"

          # Copy and rename APK variants with clean naming
          cp "${SRC_DIR}/app-universal-release.apk" "${DEST_DIR}/Gleam-${VER}-universal.apk"
          cp "${SRC_DIR}/app-arm64-v8a-release.apk" "${DEST_DIR}/Gleam-${VER}-arm64-v8a.apk"
          cp "${SRC_DIR}/app-armeabi-v7a-release.apk" "${DEST_DIR}/Gleam-${VER}-armeabi-v7a.apk"
          cp "${SRC_DIR}/app-x86_64-release.apk" "${DEST_DIR}/Gleam-${VER}-x86_64.apk"

          echo "Packaged APK Variants for ${VER}:"
          ls -la "${DEST_DIR}"

      - name: Load Release Notes
        id: release_notes
        run: |
          VER="${{ steps.get_version.outputs.VERSION }}"
          NOTE_FILE=".github/releases/${VER}.md"

          if [ -f "$NOTE_FILE" ]; then
            echo "Found release notes at ${NOTE_FILE}"
          else
            echo "Release note not found at ${NOTE_FILE}, falling back to default."
            NOTE_FILE=".github/releases/1.0.0.md"
          fi

          # Output path to file
          echo "NOTES_PATH=${NOTE_FILE}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: Gleam v${{ steps.get_version.outputs.VERSION }}
          body_path: ${{ steps.release_notes.outputs.NOTES_PATH }}
          draft: false
          prerelease: false
          files: |
            build/releases/${{ steps.get_version.outputs.VERSION }}/Gleam-${{ steps.get_version.outputs.VERSION }}-universal.apk
            build/releases/${{ steps.get_version.outputs.VERSION }}/Gleam-${{ steps.get_version.outputs.VERSION }}-arm64-v8a.apk
            build/releases/${{ steps.get_version.outputs.VERSION }}/Gleam-${{ steps.get_version.outputs.VERSION }}-armeabi-v7a.apk
            build/releases/${{ steps.get_version.outputs.VERSION }}/Gleam-${{ steps.get_version.outputs.VERSION }}-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
